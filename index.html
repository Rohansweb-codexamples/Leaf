<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaf — Block Coding Studio</title>
<style>
:root{--green:#38b66a;--deep:#153b2b;--mint:#e9f8ee;--ink:#183326;--line:#dce9df;--shadow:0 12px 35px #153b2b12}
*{box-sizing:border-box}body{margin:0;background:#f4f8f3;color:var(--ink);font:15px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:11px;font-size:21px;font-weight:850;letter-spacing:-.7px}.leafmark{width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,#7cdb8b,#23a65d);display:grid;place-items:center;color:white;font-size:20px}
.top-actions{display:flex;gap:9px;align-items:center}.btn{border:0;border-radius:11px;padding:10px 16px;font-weight:750;cursor:pointer;font-size:13px}.btn:active{transform:translateY(1px)}.subtle{background:#eef5ef;color:#31543e}.run{background:#22a85c;color:#fff;box-shadow:0 5px 13px #22a85c30}.stop{background:#fff0ed;color:#b84434}
main{max-width:1500px;margin:auto;padding:20px;display:grid;grid-template-columns:220px minmax(360px,1fr) 330px;gap:16px;height:calc(100vh - 70px);min-height:650px}
.panel{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);overflow:hidden;min-height:0}.panel-head{padding:16px 17px;border-bottom:1px solid #edf2ed;display:flex;justify-content:space-between;align-items:center;font-weight:800}.hint{font-size:11px;color:#84978a;font-weight:600}
.palette{display:flex;flex-direction:column}.categories{padding:10px;display:flex;flex-direction:column;gap:5px}.cat{padding:10px 12px;border-radius:10px;border:0;background:transparent;text-align:left;color:#607366;font-weight:700;cursor:pointer}.cat.active{background:#e9f8ee;color:#168449}.blocks{padding:5px 12px 16px;overflow:auto;display:flex;flex-direction:column;gap:9px}.block{padding:12px 13px;border-radius:10px;color:white;font-weight:750;cursor:grab;box-shadow:0 3px 0 #00000016;user-select:none}.block small{display:block;font-size:10px;opacity:.8;font-weight:600;margin-top:3px}.motion{background:#438bdc}.looks{background:#9b63d7}.control{background:#e9a12d;color:#49300a}.events{background:#e5a22e;color:#49300a}.sensing{background:#22a99b}.workspace{display:flex;flex-direction:column}.workspace-tools{display:flex;gap:7px}.workspace-body{padding:18px;overflow:auto;flex:1;background-color:#f8fbf8;background-image:radial-gradient(#d9e8db 1px,transparent 1px);background-size:18px 18px}
.dropzone{min-height:100%;border:2px dashed #d4e5d8;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:9px;align-items:flex-start}.empty{margin:auto;text-align:center;color:#91a397;max-width:280px;pointer-events:none}.empty strong{display:block;color:#607968;font-size:16px;margin:8px}.empty .big{font-size:38px}
.codeblock{position:relative;min-width:230px;max-width:100%;padding:12px 40px 12px 14px;border-radius:10px;color:white;font-weight:750;box-shadow:0 3px 0 #0002;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.codeblock input{width:55px;border:0;border-radius:6px;padding:5px;text-align:center;font-weight:800;color:#25382b;background:#fff}.codeblock .remove{position:absolute;right:9px;top:7px;border:0;background:#ffffff35;color:inherit;border-radius:6px;width:23px;height:23px;cursor:pointer}.nested{margin:6px 0 0 12px;padding:9px;border-left:3px solid #ffffff80;display:flex;flex-direction:column;gap:7px;min-width:190px}.codeblock.repeat{display:block;min-width:270px}.codeblock.repeat .repeat-title{display:flex;align-items:center;gap:8px}.drop-here{border:1px dashed #ffffff90;border-radius:7px;padding:8px;font-size:11px;opacity:.85}
.right{display:flex;flex-direction:column;gap:16px;min-height:0}.stage-panel{flex:1;display:flex;flex-direction:column;min-height:300px}.stage{margin:14px;background:linear-gradient(180deg,#dff4ff 0%,#eaf9e7 75%);border-radius:13px;position:relative;flex:1;min-height:220px;overflow:hidden;display:grid;place-items:center}.ground{position:absolute;bottom:0;height:24%;width:100%;background:#9bdb91;border-radius:50% 50% 0 0/25% 25% 0 0}.sprite{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:54px;transition:left .25s,top .25s,transform .25s;z-index:2}.speech{position:absolute;top:-27px;left:30px;background:white;color:#345;padding:7px 11px;border-radius:12px;font-size:12px;white-space:nowrap;box-shadow:0 3px 12px #0001;display:none}.console{height:150px;flex:none}.console-content{padding:12px 16px;font:12px ui-monospace,monospace;color:#668072;overflow:auto;max-height:110px}.console-line{padding:3px 0;border-bottom:1px solid #f0f4f0}.stats{display:flex;gap:16px;color:#84978a;font-size:11px;font-weight:700}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173b2b;color:white;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:1050px){main{grid-template-columns:190px minmax(300px,1fr);height:auto;min-height:calc(100vh - 70px)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.stage-panel{min-height:350px}}
@media(max-width:650px){header{padding:0 12px}.brand{font-size:18px}.top-actions .subtle{display:none}main{display:flex;flex-direction:column;padding:10px;height:auto}.panel{min-height:unset}.palette{height:260px}.categories{flex-direction:row;overflow:auto}.cat{white-space:nowrap}.blocks{display:grid;grid-template-columns:1fr 1fr;overflow:auto}.workspace{height:430px}.right{display:flex}.stage-panel{height:360px}.console{height:150px}}
</style>
</head>
<body>
<header><div class="brand"><div class="leafmark">L</div>Leaf <span style="font-size:12px;color:#91a397;font-weight:650;letter-spacing:0">BLOCK CODING</span></div><div class="top-actions"><button class="btn subtle" id="reset">New project</button><button class="btn subtle" id="clear">Clear blocks</button><button class="btn run" id="run">▶ Run</button><button class="btn stop" id="stop">■ Stop</button></div></header>
<main>
<section class="panel palette"><div class="panel-head">Block library <span class="hint">DRAG BLOCKS</span></div><div class="categories" id="categories"><button class="cat active" data-cat="motion">Motion</button><button class="cat" data-cat="looks">Looks</button><button class="cat" data-cat="control">Control</button><button class="cat" data-cat="events">Events</button><button class="cat" data-cat="sensing">Sound</button></div><div class="blocks" id="blocks"></div></section>
<section class="panel workspace"><div class="panel-head"><span>Code workspace</span><div class="workspace-tools"><span class="hint">STACK BLOCKS TO BUILD</span></div></div><div class="workspace-body"><div class="dropzone" id="dropzone"><div class="empty" id="empty"><div class="big">🧩</div><strong>Your code starts here</strong>Drag blocks from the library into this space, then press Run.</div></div></div></section>
<aside class="right"><section class="panel stage-panel"><div class="panel-head">Live stage <span class="hint">PREVIEW</span></div><div class="stage" id="stage"><div class="ground"></div><div class="sprite" id="sprite">🐸<div class="speech" id="speech"></div></div></div></section><section class="panel console"><div class="panel-head">Output <span class="stats"><span id="blockcount">0 BLOCKS</span><span id="status">READY</span></span></div><div class="console-content" id="console"><div class="console-line">Welcome to Leaf. Your program output will appear here.</div></div></section></aside>
</main><div class="toast" id="toast"></div>
<script>
const definitions={
motion:[['move','Move','Move','steps','10','motion'],['turn','Turn','Turn','degrees','90','motion'],['home','Go to centre','Go to centre','','','motion']],
looks:[['say','Say','Say','message','Hello!','looks'],['think','Think','Think','message','Hmm...','looks'],['size','Change size','Change size','percent','120','looks']],
control:[['repeat','Repeat','Repeat','times','3','control'],['wait','Wait','Wait','seconds','1','control']],
events:[['start','When run clicked','When run clicked','','','events']],
sensing:[['sound','Play sound','Play sound','','','sensing']]
};
let program=[],active='motion',running=false,stopFlag=false,position={x:50,y:52,size:100,turn:0};
const $=id=>document.getElementById(id);
function renderLibrary(){document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.cat===active));$('blocks').innerHTML='';definitions[active].forEach(d=>{let el=document.createElement('div');el.className='block '+d[5];el.draggable=true;el.innerHTML=d[2]+(d[3]?'<small>'+d[3]+'</small>':'');el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',d[0]));el.addEventListener('click',()=>addBlock(d[0]));$('blocks').append(el)})}
document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderLibrary()});
function addBlock(type){const d=Object.values(definitions).flat().find(x=>x[0]===type);if(!d)return;program.push({type,value:d[4],children:[]});renderProgram();toast('Block added')}
function blockMarkup(b,i){const d=Object.values(definitions).flat().find(x=>x[0]===b.type);let label=d[1],field=d[3]?'<input aria-label="'+d[3]+'" value="'+escapeHtml(b.value)+'" data-index="'+i+'">':'';if(b.type==='repeat')return '<div class="codeblock repeat '+d[5]+'" data-index="'+i+'"><button class="remove" data-remove="'+i+'">×</button><div class="repeat-title">'+label+field+' times</div><div class="nested" data-parent="'+i+'">'+(b.children.length?b.children.map((c,j)=>blockMarkup(c,i+'-'+j)).join(''):'<div class="drop-here">Drop blocks inside repeat</div>')+'</div></div>';return '<div class="codeblock '+d[5]+'" data-index="'+i+'"><button class="remove" data-remove="'+i+'">×</button>'+label+field+'</div>'}
function renderProgram(){let zone=$('dropzone');zone.innerHTML=program.length?program.map((b,i)=>blockMarkup(b,i)).join(''):'<div class="empty" id="empty"><div class="big">🧩</div><strong>Your code starts here</strong>Drag blocks from the library into this space, then press Run.</div>';$('blockcount').textContent=countBlocks(program)+' BLOCKS';zone.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{let parts=inp.dataset.index.split('-').map(Number);let item=program[parts.shift()];while(parts.length)item=item.children[parts.shift()];item.value=inp.value});zone.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>{let parts=btn.dataset.remove.split('-').map(Number);let arr=program;while(parts.length>1)arr=arr[parts.shift()].children;arr.splice(parts[0],1);renderProgram()});zone.querySelectorAll('.nested').forEach(n=>{n.ondragover=e=>e.preventDefault();n.ondrop=e=>{e.preventDefault();let type=e.dataTransfer.getData('text/plain');if(!type)return;let idx=Number(n.dataset.parent);const d=Object.values(definitions).flat().find(x=>x[0]===type);program[idx].children.push({type,value:d[4],children:[]});renderProgram()}})}
function countBlocks(arr){return arr.reduce((n,b)=>n+1+countBlocks(b.children||[]),0)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const zone=$('dropzone');zone.ondragover=e=>e.preventDefault();zone.ondrop=e=>{e.preventDefault();let type=e.dataTransfer.getData('text/plain');if(type)addBlock(type)};
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
function log(t){let line=document.createElement('div');line.className='console-line';line.textContent=t;$('console').append(line);$('console').scrollTop=$('console').scrollHeight}
function paint(){let s=$('sprite');s.style.left=position.x+'%';s.style.top=position.y+'%';s.style.fontSize=(54*position.size/100)+'px';s.style.transform='translate(-50%,-50%) rotate('+position.turn+'deg)';}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function execute(list){for(const b of list){if(stopFlag)return;let v=b.value;switch(b.type){case'move':position.x=Math.max(7,Math.min(93,position.x+(Number(v)||0)/5));log('Moved '+v+' steps');break;case'turn':position.turn+=Number(v)||0;log('Turned '+v+' degrees');break;case'home':position={x:50,y:52,size:100,turn:0};log('Returned to centre');break;case'say':case'think':$('speech').textContent=v;$('speech').style.display='block';$('speech').style.borderRadius=b.type==='think'?'18px':'12px';log((b.type==='say'?'Says: ':'Thinks: ')+v);break;case'size':position.size=Math.max(30,Math.min(220,Number(v)||100));log('Size changed to '+position.size+'%');break;case'repeat':log('Repeat '+v+' times');for(let i=0;i<Math.max(0,Math.min(30,Number(v)||0));i++){if(stopFlag)return;await execute(b.children)}break;case'wait':await sleep(Math.max(0,Math.min(10,Number(v)||0))*1000);break;case'sound':log('Sound block reached');break;case'start':log('Program started');break;}paint();await sleep(220)}} 
$('run').onclick=async()=>{if(running)return;running=true;stopFlag=false;$('status').textContent='RUNNING';$('console').innerHTML='';$('speech').style.display='none';position={x:50,y:52,size:100,turn:0};paint();log('▶ Program started');await execute(program);if(!stopFlag)log('✓ Program finished');running=false;$('status').textContent='READY'};
$('stop').onclick=()=>{stopFlag=true;running=false;$('status').textContent='STOPPED';log('■ Program stopped')};
$('clear').onclick=()=>{program=[];renderProgram();toast('Workspace cleared')};
$('reset').onclick=()=>{program=[];position={x:50,y:52,size:100,turn:0};paint();$('speech').style.display='none';$('console').innerHTML='<div class="console-line">New Leaf project created.</div>';renderProgram()};
renderLibrary();renderProgram();paint();
</script>
</body></html>
